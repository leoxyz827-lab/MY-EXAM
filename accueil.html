<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08172a">
  <meta name="description" content="Bienvenue chez MY EXAM.">
  <title>Bienvenue chez MY EXAM</title>
  <style>
    :root {
      --myexam-rose: #9b1748;
      --myexam-rose-light: #ee3a80;
      --myexam-blue: #136b9b;
      --myexam-blue-light: #49bcf2;
      --deep: #08172a;
      --deeper: #040b17;
      --white: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--deep);
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .welcome {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 20px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 35% 43% at 18% 17%, rgba(155,23,72,.19), transparent 100%),
        radial-gradient(ellipse 42% 47% at 83% 81%, rgba(19,107,155,.23), transparent 100%),
        linear-gradient(150deg, #071324 0%, #0c2340 52%, #050c19 100%);
    }
    .welcome::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.14) .85px, transparent 1px);
      background-size: 29px 29px;
      opacity: .13;
      -webkit-mask-image: radial-gradient(ellipse at center, transparent 8%, #000 95%);
      mask-image: radial-gradient(ellipse at center, transparent 8%, #000 95%);
    }
    .orb {
      position: absolute;
      z-index: -1;
      width: min(55vw, 650px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(85px);
      opacity: .24;
      pointer-events: none;
    }
    .orb-one { top: -40%; left: -20%; background: var(--myexam-rose); }
    .orb-two { bottom: -48%; right: -15%; background: var(--myexam-blue); }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(100%, 760px);
      text-align: center;
      transform: translateY(-1vh);
      animation: appear .85s cubic-bezier(.2,.8,.2,1) both;
    }
    h1 { margin: 0; font-weight: 700; }
    .greeting {
      display: block;
      color: rgba(255,255,255,.89);
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 450;
      letter-spacing: .025em;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .brand {
      display: block;
      white-space: nowrap;
      font-size: clamp(55px, 11vw, 113px);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -.055em;
      text-shadow: 0 15px 65px rgba(0,0,0,.19);
    }
    .brand-my { color: #58b7ea; }
    .brand-exam { color: #f03d80; }
    .accent-line {
      display: block;
      width: 99px;
      height: 3px;
      margin: 29px 0 49px;
      border-radius: 30px;
      background: linear-gradient(90deg, var(--myexam-blue-light), var(--myexam-rose-light));
      box-shadow: 0 0 25px rgba(55,168,227,.28);
    }
    .spinner-area {
      position: relative;
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
    }
    .spinner {
      position: absolute;
      inset: 0;
      border: 5px solid rgba(255,255,255,.09);
      border-radius: 50%;
      border-top-color: var(--myexam-rose-light);
      border-right-color: var(--myexam-blue-light);
      border-bottom-color: rgba(255,255,255,.09);
      animation: rotate 1.07s linear infinite;
      box-shadow: 0 0 34px rgba(27,104,169,.12);
    }
    .spinner::after {
      content: "";
      position: absolute;
      inset: 11px;
      border: 2px solid transparent;
      border-left-color: #d63271;
      border-bottom-color: #2589c6;
      border-radius: 50%;
      animation: rotateReverse 1.65s linear infinite;
    }
    .spinner-core {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 18px rgba(255,255,255,.6);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    body.is-leaving .center { opacity: 0; transform: translateY(-16px) scale(.99); transition: opacity .35s ease, transform .35s ease; }
    @keyframes appear { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(-1vh); } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes rotateReverse { to { transform: rotate(-360deg); } }
    @media (max-width: 520px) {
      .greeting { margin-bottom: 11px; }
      .brand { font-size: clamp(47px, 13.5vw, 69px); letter-spacing: -.055em; }
      .accent-line { margin-top: 23px; margin-bottom: 41px; }
      .spinner-area { width: 76px; height: 76px; }
      .spinner { border-width: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .center { animation: none; }
      .spinner { animation-duration: 3s; }
      .spinner::after { animation-duration: 3s; }
      body.is-leaving .center { transition: none; }
    }
  </style>
  <script>
    // Active les animations seulement si JavaScript est disponible.
    document.documentElement.classList.add('mx-js');
    try {
      if (sessionStorage.getItem('mx-arrival-pending') === 'true') {
        document.documentElement.classList.add('mx-from-navigation');
        sessionStorage.removeItem('mx-arrival-pending');
      }
    } catch (_) {}
  </script>
</head>
<body>
  <main class="welcome" aria-label="Accueil MY EXAM">
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>
    <div class="center">
      <h1>
        <span class="greeting">Bienvenue chez</span>
        <span class="brand"><span class="brand-my">MY</span> <span class="brand-exam">EXAM</span></span>
      </h1>
      <span class="accent-line" aria-hidden="true"></span>
      <div class="spinner-area" role="status" aria-label="Chargement du site MY EXAM">
        <div class="spinner" aria-hidden="true"></div>
        <div class="spinner-core" aria-hidden="true"></div>
        <span class="sr-only">Chargement en cours</span>
      </div>
    </div>
  </main>
  <script>
    const DUREE_LOADER = 2600;
    window.setTimeout(() => {
      document.body.classList.add('is-leaving');
      window.location.replace('./index.html');
    }, DUREE_LOADER);
  </script>
</body>
</html>
